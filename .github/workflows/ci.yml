name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    outputs:
      needs_fix: ${{ steps.csfixer.outputs.needs_fix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Download php-cs-fixer
        run: |
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run php-cs-fixer (dry-run)
        id: csfixer
        run: |
          set +e
          config_arg=""
          if [ -f .php-cs-fixer.php ]; then
            config_arg="--config=.php-cs-fixer.php"
          elif [ -f .php-cs-fixer.dist.php ]; then
            config_arg="--config=.php-cs-fixer.dist.php"
          fi
          php ./php-cs-fixer fix \
            ${config_arg} \
            --diff \
            --dry-run \
            --show-progress=none \
            --using-cache=no
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 8 ]; then
            echo "::warning::php-cs-fixer found fixable issues. Auto-fix will run on push."
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::php-cs-fixer failed with exit code ${code}."
          exit "$code"

  php-cs-fixer-apply:
    name: PHP CS Fixer (apply on failure)
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    if: >-
      ${{
        needs.php-cs-fixer.outputs.needs_fix == 'true' &&
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]'
      }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Download php-cs-fixer
        run: |
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run php-cs-fixer (apply)
        run: |
          config_arg=""
          if [ -f .php-cs-fixer.php ]; then
            config_arg="--config=.php-cs-fixer.php"
          elif [ -f .php-cs-fixer.dist.php ]; then
            config_arg="--config=.php-cs-fixer.dist.php"
          fi
          php ./php-cs-fixer fix \
            ${config_arg} \
            --diff \
            --show-progress=none \
            --using-cache=no

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply php-cs-fixer"
          git push
