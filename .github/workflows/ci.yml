name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    outputs:
      needs_fix: ${{ steps.csfixer.outputs.needs_fix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Download php-cs-fixer
        run: |
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run php-cs-fixer (dry-run)
        id: csfixer
        run: |
          set +e
          config_arg=""
          if [ -f .php-cs-fixer.php ]; then
            config_arg="--config=.php-cs-fixer.php"
          elif [ -f .php-cs-fixer.dist.php ]; then
            config_arg="--config=.php-cs-fixer.dist.php"
          fi
          php ./php-cs-fixer fix \
            ${config_arg} \
            --diff \
            --dry-run \
            --show-progress=none \
            --using-cache=no
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 8 ]; then
            echo "::warning::php-cs-fixer found fixable issues. Auto-fix will run on push."
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::php-cs-fixer failed with exit code ${code}."
          exit "$code"

  php-cs-fixer-apply:
    name: PHP CS Fixer (apply on failure)
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    if: >-
      ${{
        needs.php-cs-fixer.outputs.needs_fix == 'true' &&
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]'
      }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Download php-cs-fixer
        run: |
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
          chmod +x php-cs-fixer

      - name: Run php-cs-fixer (apply)
        run: |
          config_arg=""
          if [ -f .php-cs-fixer.php ]; then
            config_arg="--config=.php-cs-fixer.php"
          elif [ -f .php-cs-fixer.dist.php ]; then
            config_arg="--config=.php-cs-fixer.dist.php"
          fi
          php ./php-cs-fixer fix \
            ${config_arg} \
            --diff \
            --show-progress=none \
            --using-cache=no

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply php-cs-fixer"
          git push

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    # needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Build Docker images
        run: docker compose -f compose.yml build

      - name: Start containers
        run: docker compose -f compose.yml up -d

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker compose -f compose.yml exec -T database mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "Database is ready"
              exit 0
            fi

            echo "Waiting for database..."
            sleep 2
          done

          echo "Database is not ready"
          docker compose -f compose.yml logs database
          exit 1

      - name: debug
        run: docker compose logs

      - name: Install API dependencies
        run: docker compose -f compose.yml exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 composer install --no-interaction --prefer-dist --no-progress'

      - name: Update database schema
        run: docker compose -f compose.yml exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 php bin/console d:s:u --force -n --env=test'

      - name: Run API tests
        run: docker compose -f compose.yml exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover var/coverage/clover.xml'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: var/coverage/clover.xml
          if-no-files-found: error

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f compose.yml logs

      - name: Stop containers
        if: always()
        run: docker compose -f compose.yml down -v

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: php-coverage
          path: var/coverage

      - name: Verify coverage report
        run: test -s var/coverage/clover.xml

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Add SonarQube link to summary
        if: always()
        run: |
          echo "## SonarQube" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Voir l'analyse SonarQube](${{ vars.SONAR_HOST_URL }}/dashboard?id=Enzobu_locked-in-backend_e6de9708-ac0a-41bb-ad90-210eb68a80fe&codeScope=overall)" >> $GITHUB_STEP_SUMMARY
