name: locked-in

services:
  database:
    image: mariadb:11.8.5-ubi9
    container_name: locked-in-database
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${MARIADB_USER:-app}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-app_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-app}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - locked-in_network
    expose:
      - 3306
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: locked-in-phpmyadmin
    ports:
      - 15435:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=database
      - PMA_USER=${MARIADB_USER:-app}
      - PMA_PASSWORD=${MARIADB_PASSWORD:-app_password}
    depends_on:
      - database
    networks:
      - locked-in_network
    restart: unless-stopped

  apache:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: locked-in-apache
    volumes:
      - .:/var/www/
      - ./docker/apache/apache.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./docker/apache/php.ini:/usr/local/etc/php/conf.d/php.custom.ini
      - ./docker/apache/.htaccess:/var/www/public/.htaccess
    ports:
      - 15436:80
    depends_on:
      - database
    networks:
      - locked-in_network
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: locked-in-stripe-cli
    command: listen --forward-to http://apache:80/api/stripe/webhook
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - apache
    networks:
      - locked-in_network
    restart: unless-stopped

networks:
  locked-in_network:
    driver: bridge

volumes:
  database_data:
    driver: local
